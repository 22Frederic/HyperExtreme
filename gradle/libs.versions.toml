[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-multiplatform = "1.13.0-rc01"
androidx-activity = "1.13.0"
# 0.9.5-rc01（2026-11-25）：beta02 起强制 compose-multiplatform 1.13.0-rc01，故两者同升。
# 性能改动集中在 beta02 / beta04（渐进模糊管线、GraphicsLayer 复用、GlassTopAppBar shader 缓存）。
miuix = "0.9.5-rc01"
# ONNX Runtime **完整版**（支持 .onnx 与 .ort）：mobile minimal build 缺 ConvInteger /
# 一堆 custom op，实测跑不动 DA V2 int8，2026-10-22 按用户要求退回完整版。
onnxruntime-android = "1.31.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
miuix-core = { module = "top.yukonga.miuix.kmp:miuix-core", version.ref = "miuix" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur", version.ref = "miuix" }
# 0.9.5 新增：OS4 玻璃组件（GlassDropdownPreference / GlassDialog / GlassTopAppBar …）
miuix-glass = { module = "top.yukonga.miuix.kmp:miuix-glass", version.ref = "miuix" }
# 0.9.5 新增：材质与描边（EdgeStroke / GlassMaterials / GlassStyles），取代已删除的 blur.highlight
miuix-material = { module = "top.yukonga.miuix.kmp:miuix-material", version.ref = "miuix" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime-android" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
